appId: space.max.room
productName: Max
artifactName: Max-Setup-${version}.${ext}
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
win:
  target:
    - nsis
  executableName: Max
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Max
